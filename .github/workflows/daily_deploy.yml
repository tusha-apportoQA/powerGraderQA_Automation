name: Morning QA Hub Sync
on:
  schedule:
    # 5:30 AM PST is 1:30 PM (13:30) UTC
    - cron: '30 13 * * *' 
  workflow_dispatch: # Keeps the "Run Now" button available for testing

jobs:
  automation-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Full Test & Deploy
        run: npm run full-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # These ensure your sync.js can talk to TestRail from the cloud
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_KEY: ${{ secrets.TESTRAIL_KEY }}
