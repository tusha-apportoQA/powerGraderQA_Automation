<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PowerGrader QA Hub</title>
</head>
<body class="bg-slate-900 text-white p-8 font-sans">
    <header class="mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-blue-400">PowerGrader Automation Dashboard</h1>
        <p class="text-slate-400 mt-2" id="sync-time">Last TestRail Sync: --</p>
    </header>

    <section class="grid grid-cols-1 md:grid-cols-7 gap-4 mb-10">
        <div class="bg-slate-800 p-4 rounded-xl border-b-4 border-blue-500 shadow-lg text-center">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">Total Cases</h3>
            <p id="total" class="text-2xl font-bold mt-1">--</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border-b-4 border-green-500 shadow-lg text-center">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">Automated</h3>
            <p id="automated" class="text-2xl font-bold text-green-400 mt-1">--</p>
        </div>
        
        <div class="bg-slate-800 p-4 rounded-xl border-b-4 border-purple-500 shadow-lg text-center">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">Coverage %</h3>
            <p id="percentage" class="text-2xl font-bold text-purple-400 mt-1">--%</p>
        </div>

        <div id="ai-card" onclick="openDriftCategory()" class="bg-slate-800 p-4 rounded-xl border-b-4 border-slate-500 shadow-lg text-center transition-all duration-500 cursor-pointer hover:bg-slate-700">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">AI Reliability</h3>
            <p id="ai-status" class="text-2xl font-bold mt-1">Checking...</p>
            <p id="ai-detail" class="text-[9px] text-slate-500 italic mt-1">Analyzing drift</p>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border-b-4 border-orange-500 shadow-lg text-center">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">In Progress</h3>
            <p id="in_progress" class="text-2xl font-bold text-orange-400 mt-1">--</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border-b-4 border-yellow-500 shadow-lg text-center">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">Yet to Automate</h3>
            <p id="yet_to_automate" class="text-2xl font-bold text-yellow-400 mt-1">--</p>
        </div>
        <div class="bg-slate-800 p-4 rounded-xl border-b-4 border-red-500 shadow-lg text-center">
            <h3 class="text-slate-400 uppercase text-[10px] font-bold">Not Automatable</h3>
            <p id="not_automatable" class="text-2xl font-bold text-red-400 mt-1">--</p>
        </div>
    </section>

    <section class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-2xl">
        <iframe src="report.html" class="w-full h-[700px] border-none"></iframe>
    </section>

    <script>
        fetch('./testrail-stats.json')
            .then(res => res.json())
            .then(data => {
                const total = data.total || 0;
                const automated = data.automated || 0;
                const percent = total > 0 ? ((automated / total) * 100).toFixed(1) : 0;

                document.getElementById('total').innerText = total;
                document.getElementById('automated').innerText = automated;
                document.getElementById('percentage').innerText = percent + "%";
                document.getElementById('in_progress').innerText = data.automation_in_progress;
                document.getElementById('yet_to_automate').innerText = data.yet_to_automate;
                document.getElementById('not_automatable').innerText = data.not_automatable;
                document.getElementById('sync-time').innerText = "Last Sync: " + data.lastUpdated;

                // AI RELIABILITY LOGIC
                // We determine health based on your actual run stats
                // If there are failures due to MISMATCH, we flag them here
                updateAIHealth(data);
            })
            .catch(err => console.error("Error loading stats:", err));

        function updateAIHealth(data) {
            const aiStatus = document.getElementById('ai-status');
            const aiCard = document.getElementById('ai-card');
            const aiDetail = document.getElementById('ai-detail');

            // Logic: If the latest Allure/TestRail sync shows failures in the 'Automated' suite, 
            // and we know your recent runs have 75% pass rate due to drift:
            const passRate = 75; // You can pass this dynamically from your deploy script if preferred

            if (passRate >= 95) {
                aiStatus.innerText = "Stable";
                aiStatus.className = "text-2xl font-bold text-green-400 mt-1";
                aiCard.style.borderColor = "#4ade80";
                aiDetail.innerText = "AI Math is consistent";
            } else if (passRate >= 70) {
                aiStatus.innerText = "Drift";
                aiStatus.className = "text-2xl font-bold text-yellow-400 mt-1";
                aiCard.style.borderColor = "#fbbf24";
                aiDetail.innerText = "Minor score changes detected";
            } else {
                aiStatus.innerText = "Critical";
                aiStatus.className = "text-2xl font-bold text-red-400 mt-1";
                aiCard.style.borderColor = "#f87171";
                aiDetail.innerText = "Action Required: Check reasoning";
            }
        }

        function openDriftCategory() {
            // This tells the iframe to navigate to the "Categories" tab in Allure
            // where you can see the "Score Mismatch" or "SBERT Drift" failures.
            const reportIframe = document.querySelector('iframe');
            reportIframe.src = "report.html#categories";
        }
    </script>
</body>
</html>
